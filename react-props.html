<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>


    <script type="text/babel">
      const container = document.querySelector('.js-container');
      const root = ReactDOM.createRoot(container);

      function MyButton(props) {
        return (
          <button style={{ padding: '10px 20px', margin: '5px', fontSize: '16px' }}>
            {props.buttonText}
          </button>
        );
      }

    
      function App() {
        return (
          <div>
            <h1>React Props usage</h1>
            <p>Below we have given the components a separate (props) name:</p>
            
        
            <MyButton buttonText="Login"/>
            <br />
            <MyButton buttonText="Sign Up"/>
            <br />
            <MyButton buttonText="Submit Now"/>
            <br />
            <MyButton buttonText="Cancel"/>
          </div>
        );
      }

      root.render(<App />);
    </script>
  </body>
</html>
